<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#312e81" stroke-width="8" />

  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#iconGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Stylized Monogram "D" / Dev Brackets Icon -->
  <g filter="url(#glow)">
    <!-- Code Bracket Left < -->
    <path d="M 160 190 L 105 256 L 160 322" fill="none" stroke="url(#iconGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Code Bracket Right > -->
    <path d="M 352 190 L 407 256 L 352 322" fill="none" stroke="url(#iconGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Slash / Stylized D -->
    <path d="M 285 160 L 227 352" fill="none" stroke="url(#iconGrad)" stroke-width="36" stroke-linecap="round" />
  </g>
</svg>
